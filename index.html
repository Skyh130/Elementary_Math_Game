<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 확대 방지 및 모바일 화면에 정확히 맞추기 위한 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>수학 용사의 모험</title>
  <style>
    /* 전체 리셋 및 터치 최적화 (더블탭 확대 방지) */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Malgun Gothic', sans-serif; 
      touch-action: manipulation; 
    }
    
    html, body { 
      width: 100%; 
      height: 100%; /* vh 대신 %를 사용하여 브라우저 UI에 의한 잘림 방지 */
      background-color: #2c3e50; 
      color: white; 
      overflow: hidden; 
    }

    /* 화면 전체를 꽉 채우는 컨테이너 */
    #app-container {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
    }
    
    /* 상단 대시보드 (크기 고정) */
    #dashboard { 
      flex-shrink: 0; /* 화면이 작아져도 줄어들지 않음 */
      background-color: #34495e; 
      padding: 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 4px solid #1abc9c; 
    }
    .hero-info { font-size: 1.2rem; font-weight: bold; color: #f1c40f; }
    .hero-hp { font-size: 1.2rem; color: #e74c3c; }

    /* 전투 영역 (남은 공간을 모두 차지하되, 넘치면 스크롤) */
    #battle-area { 
      flex: 1 1 auto; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      padding: 10px; 
      overflow-y: auto; 
    }
    #monster { font-size: 80px; margin-bottom: 15px; animation: bounce 1s infinite alternate; }
    #question { font-size: 3rem; font-weight: bold; background: #ecf0f1; color: #2c3e50; padding: 15px 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
    #answer-display { font-size: 2.5rem; color: #3498db; margin-top: 15px; min-height: 50px; font-weight: bold; }
    #message-log { font-size: 1.2rem; color: #2ecc71; margin-top: 5px; min-height: 30px; text-align: center; }

    /* 숫자 키패드 (크기 고정, 태블릿 하단 여백 완벽 대응) */
    #numpad { 
      flex-shrink: 0; /* 키패드가 찌그러지지 않도록 보호 */
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      padding: 15px; 
      /* 아이패드 등 하단 홈바(Safe Area) 영역을 침범하지 않도록 여백 추가 */
      padding-bottom: max(15px, env(safe-area-inset-bottom));
      background-color: #bdc3c7; 
      border-top-left-radius: 20px; 
      border-top-right-radius: 20px; 
    }
    
    .btn { 
      background-color: #fff; 
      color: #333; 
      font-size: 1.8rem; 
      font-weight: bold; 
      padding: 15px 0; /* 태블릿 세로 화면에서 너무 길어지지 않게 조정 */
      border: none; 
      border-radius: 10px; 
      box-shadow: 0 4px #95a5a6; 
      cursor: pointer; 
      user-select: none; 
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 0 #95a5a6; }
    .btn-action { background-color: #f39c12; color: white; box-shadow: 0 4px #d68910; }
    .btn-submit { 
      background-color: #2ecc71; 
      color: white; 
      box-shadow: 0 4px #27ae60; 
      grid-column: span 3; 
      font-size: 1.5rem; 
      padding: 20px 0; /* 제출 버튼은 누르기 쉽게 조금 더 크게 유지 */
    }

    /* 몬스터 애니메이션 */
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>

  <!-- 전체 화면 컨테이너 추가 -->
  <div id="app-container">
    
    <!-- 1. 대시보드 영역 -->
    <div id="dashboard">
      <div class="hero-info" id="hero-name">용사 레벨 1</div>
      <div class="hero-hp" id="hero-hp">❤️ HP: 100</div>
    </div>

    <!-- 2. 전투(문제) 영역 -->
    <div id="battle-area">
      <div id="monster">👾</div>
      <div id="question">준비 중...</div>
      <div id="answer-display"></div>
      <div id="message-log">게임을 시작합니다!</div>
    </div>

    <!-- 3. 아이 전용 터치 키패드 영역 -->
    <div id="numpad">
      <button class="btn" onclick="inputNumber(1)">1</button>
      <button class="btn" onclick="inputNumber(2)">2</button>
      <button class="btn" onclick="inputNumber(3)">3</button>
      <button class="btn" onclick="inputNumber(4)">4</button>
      <button class="btn" onclick="inputNumber(5)">5</button>
      <button class="btn" onclick="inputNumber(6)">6</button>
      <button class="btn" onclick="inputNumber(7)">7</button>
      <button class="btn" onclick="inputNumber(8)">8</button>
      <button class="btn" onclick="inputNumber(9)">9</button>
      <button class="btn btn-action" onclick="clearAnswer()">지우기</button>
      <button class="btn" onclick="inputNumber(0)">0</button>
      <button class="btn btn-action" onclick="deleteLast()">←</button>
      <button class="btn btn-submit" onclick="submitAnswer()">공격! (정답 제출)</button>
    </div>

  </div>

  <script>
    const API_URL = '여기에_배포된_웹앱_URL을_입력하세요';
    const USER_ID = 'hero_01'; 

    let currentAnswer = "";
    let questionStartTime = 0;
    
    let currentQuestion = {
      id: "Q_001",
      text: "24 + 15 = ?",
      answer: "39",
      monster: "🐉"
    };

    window.onload = () => {
      renderQuestion();
    };

    function renderQuestion() {
      document.getElementById('monster').innerText = currentQuestion.monster;
      document.getElementById('question').innerText = currentQuestion.text;
      currentAnswer = "";
      updateAnswerDisplay();
      questionStartTime = Date.now();
      showMessage("몬스터가 나타났다!");
    }

    function inputNumber(num) {
      if(currentAnswer.length < 5) {
        currentAnswer += num;
        updateAnswerDisplay();
      }
    }

    function deleteLast() {
      currentAnswer = currentAnswer.slice(0, -1);
      updateAnswerDisplay();
    }

    function clearAnswer() {
      currentAnswer = "";
      updateAnswerDisplay();
    }

    function updateAnswerDisplay() {
      document.getElementById('answer-display').innerText = currentAnswer;
    }

    function showMessage(msg, color = "#2ecc71") {
      const msgLog = document.getElementById('message-log');
      msgLog.innerText = msg;
      msgLog.style.color = color;
    }

    async function submitAnswer() {
      if (currentAnswer === "") {
        showMessage("답을 입력해주세요!", "#f1c40f");
        return;
      }

      const solveTimeSec = Math.floor((Date.now() - questionStartTime) / 1000);
      const isCorrect = (currentAnswer === currentQuestion.answer);

      if (isCorrect) {
        showMessage(`정답입니다! 몬스터를 물리쳤다! (${solveTimeSec}초 소요)`, "#3498db");
        document.getElementById('monster').innerText = "💥"; 
      } else {
        showMessage("앗, 공격이 빗나갔다! 다시 계산해보자.", "#e74c3c");
        currentAnswer = "";
        updateAnswerDisplay();
        return; 
      }

      const payload = {
        action: "submitBattleResult",
        userId: USER_ID,
        questionId: currentQuestion.id,
        userAnswer: currentAnswer,
        isCorrect: isCorrect,
        solveTimeSec: solveTimeSec,
        earnedExp: isCorrect ? 10 : 0,
        earnedGold: isCorrect ? 5 : 0
      };

      try {
        setTimeout(() => {
          currentQuestion = { id: "Q_002", text: "8 × 7 = ?", answer: "56", monster: "👻" };
          renderQuestion();
        }, 2000);

      } catch (error) {
        console.error("서버 통신 에러:", error);
        showMessage("통신에 실패했습니다.", "#e74c3c");
      }
    }
  </script>
</body>
</html>
